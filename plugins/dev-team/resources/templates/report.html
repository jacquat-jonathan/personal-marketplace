<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>{{TITLE}}</title>
<style>
  :root { --bg: #ffffff; --fg: #1a1a1a; --muted: #6b7280; --border: #e5e7eb; --accent: #2563eb; --code-bg: #f3f4f6; --ok: #15803d; --bad: #b91c1c; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #17181c; --fg: #f2f2f2; --muted: #9ca3af; --border: #33343a; --accent: #60a5fa; --code-bg: #24252b; --ok: #4ade80; --bad: #f87171; }
  }
  :root[data-theme="dark"] { --bg: #17181c; --fg: #f2f2f2; --muted: #9ca3af; --border: #33343a; --accent: #60a5fa; --code-bg: #24252b; --ok: #4ade80; --bad: #f87171; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 2rem 16px; background: var(--bg); color: var(--fg); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; line-height: 1.6; }
  main { max-width: 860px; margin: 0 auto; }
  h1 { font-size: 1.75rem; margin-bottom: .25rem; }
  .meta { color: var(--muted); margin-top: 0; }
  section { margin-bottom: 2rem; }
  h2 { font-size: 1.05rem; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); border-bottom: 1px solid var(--border); padding-bottom: .4rem; }
  h3 { font-size: 1rem; margin-bottom: .25rem; }
  .empty { color: var(--muted); font-style: italic; }
  code, pre { background: var(--code-bg); border-radius: 4px; font-size: .88em; }
  code { padding: .1em .3em; }
  pre { padding: .75rem 1rem; overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: .92em; display: block; overflow-x: auto; }
  th, td { border: 1px solid var(--border); padding: .4rem .6rem; text-align: left; vertical-align: top; }
  th { background: var(--code-bg); }
  .run { border-left: 3px solid var(--border); padding-left: 1rem; margin-bottom: 1.5rem; }
  .pass { color: var(--ok); font-weight: 600; }
  .fail { color: var(--bad); font-weight: 600; }
  a { color: var(--accent); }
  ul, ol { padding-left: 1.25rem; }
</style>
</head>
<body>
<main>
  <h1>{{TITLE}}</h1>
  <p class="meta" id="meta">Analysis report · {{TYPE}} · {{DATE}}</p>
  <section id="summary"><h2>Summary</h2><p class="empty">Nothing yet.</p></section>
  <section id="answers"><h2>Answers</h2><p class="empty">Nothing yet.</p></section>
  <section id="flows"><h2>Flows</h2><p class="empty">Nothing yet.</p></section>
  <section id="risks"><h2>Risks and surprises</h2><p class="empty">Nothing yet.</p></section>
  <section id="open-questions"><h2>Open questions</h2><p class="empty">Nothing yet.</p></section>
</main>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>{{TITLE}}</title>
<style>
  :root { --bg: #ffffff; --fg: #1a1a1a; --muted: #6b7280; --border: #e5e7eb; --accent: #2563eb; --code-bg: #f3f4f6; --ok: #15803d; --bad: #b91c1c; --warn: #b45309; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #17181c; --fg: #f2f2f2; --muted: #9ca3af; --border: #33343a; --accent: #60a5fa; --code-bg: #24252b; --ok: #4ade80; --bad: #f87171; --warn: #fbbf24; }
  }
  :root[data-theme="dark"] { --bg: #17181c; --fg: #f2f2f2; --muted: #9ca3af; --border: #33343a; --accent: #60a5fa; --code-bg: #24252b; --ok: #4ade80; --bad: #f87171; --warn: #fbbf24; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 2rem 16px; background: var(--bg); color: var(--fg); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; line-height: 1.6; }
  main { max-width: 860px; margin: 0 auto; }
  h1 { font-size: 1.75rem; margin-bottom: .25rem; }
  .meta { color: var(--muted); margin-top: 0; }
  section { margin-bottom: 2rem; }
  h2 { font-size: 1.05rem; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); border-bottom: 1px solid var(--border); padding-bottom: .4rem; }
  h3 { font-size: 1rem; margin-bottom: .25rem; }
  .empty { color: var(--muted); font-style: italic; }
  code, pre { background: var(--code-bg); border-radius: 4px; font-size: .88em; }
  code { padding: .1em .3em; }
  pre { padding: .75rem 1rem; overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: .92em; display: block; overflow-x: auto; }
  th, td { border: 1px solid var(--border); padding: .4rem .6rem; text-align: left; vertical-align: top; }
  th { background: var(--code-bg); }
  .run { border-left: 3px solid var(--border); padding-left: 1rem; margin-bottom: 1.5rem; }
  .pass { color: var(--ok); font-weight: 600; }
  .fail { color: var(--bad); font-weight: 600; }
  figure { margin: 1.25rem 0; }
  figcaption { color: var(--muted); font-size: .88em; margin-top: .4rem; }
  svg.diagram { display: block; width: 100%; height: auto; }
  svg.diagram text { fill: var(--fg); font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  svg.diagram text.muted { fill: var(--muted); font-size: 11px; }
  svg.diagram .box { fill: var(--code-bg); stroke: var(--border); }
  svg.diagram .focus { fill: var(--code-bg); stroke: var(--accent); stroke-width: 2; }
  svg.diagram .line { stroke: var(--muted); fill: none; }
  svg.diagram .life { stroke: var(--border); stroke-dasharray: 4 4; }
  svg.diagram .ok { stroke: var(--ok); } svg.diagram .bad { stroke: var(--bad); } svg.diagram .warn { stroke: var(--warn); }
  svg.diagram marker path { fill: var(--muted); }
  .callout { border-left: 3px solid var(--accent); background: var(--code-bg); padding: .6rem .9rem; margin: 1rem 0; border-radius: 0 4px 4px 0; }
  .callout.warn { border-left-color: var(--warn); } .callout.bad { border-left-color: var(--bad); } .callout.ok { border-left-color: var(--ok); }
  .badge { display: inline-block; padding: 0 .5em; border: 1px solid var(--border); border-radius: 999px; font-size: .8em; }
  .badge.ok { color: var(--ok); border-color: var(--ok); } .badge.bad { color: var(--bad); border-color: var(--bad); } .badge.warn { color: var(--warn); border-color: var(--warn); }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: .75rem; margin: 1rem 0; }
  .card { border: 1px solid var(--border); border-radius: 6px; padding: .6rem .8rem; }
  .card strong { display: block; }
  details { border: 1px solid var(--border); border-radius: 6px; padding: .4rem .8rem; margin: .5rem 0; }
  summary { cursor: pointer; font-weight: 600; }
  a { color: var(--accent); }
  ul, ol { padding-left: 1.25rem; }
</style>
</head>
<body>
<main>
  <h1>{{TITLE}}</h1>
  <p class="meta" id="meta">QA · {{TYPE}} · {{DATE}}</p>
  <section id="verdict"><h2>Latest verdict</h2><p class="empty">Nothing yet.</p></section>
  <section id="runs"><h2>Runs</h2><p class="empty">Nothing yet.</p></section>
</main>
</body>
</html>
